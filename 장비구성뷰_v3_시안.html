      /* 화면 회전·창 크기 변경 시 새 화면 크기에 맞춰 "한눈에 보기" 배율로 다시 맞춘다. */
      mapView.scale = null;
      setupMapPanZoom();
    }
  }, 150);
});

/* [2026-09-16] label에 명시적 줄바꿈("\n")이 있으면 그 지점에서 먼저 강제로 나누고,
   각 줄 안에서만 기존처럼 폭 기준 자동 줄바꿈을 적용한다 — "FTGS" / "(궤도회로 장치)"처럼
   자동 줄바꿈만으로는 어색하게 잘리는 라벨을 원하는 지점에서 정확히 끊기 위함. */
function wrapLabel(label, maxChars){
  var out = [];
  label.split('\n').forEach(function(seg){
    var words = seg.split(' ');
    var lines = [], cur = '';
    words.forEach(function(w){
      var trial = cur ? cur + ' ' + w : w;
      if (trial.length > maxChars && cur) { lines.push(cur); cur = w; }
      else cur = trial;
    });
    if (cur) lines.push(cur);
    out = out.concat(lines);
  });
  return out.slice(0,3);
}

/* =========================================================
   TAB 2 — 랙 구성 : dispatch by kind
   ========================================================= */
function renderRackView(){
  var g = GROUPS[state.group];
  if (g.kind === 'cabinet') return renderCabinetLevel(state.group);
  if (g.kind === 'boardrow') return renderFtgsBoardRow();
  return renderConceptGrid(state.group);
}

/* ---- board-info ids for a group that never show up in the rack layout (no row.boardRef,
   and not part of any channelFrame.boardOrder) — kept reachable via an "기타 항목" appendix
   so a board-info entry never becomes a dead end just because rack-layout.json doesn't
   place it in a physical row (e.g. software-only items, or fixed accessories with no
   dedicated row like LZB_FAN). */
function groupOrphanBoardIds(groupKey, rack){
  var referenced = {};
  (rack.boards || []).forEach(function(row){
    if (row.boardRef) referenced[row.boardRef] = true;
    if (row.boardOrder) row.boardOrder.forEach(function(bid){ referenced[bid] = true; });
    if (row.frameRef && rack.channelFrames && rack.channelFrames[row.frameRef]) {
      (rack.channelFrames[row.frameRef].boardOrder || []).forEach(function(bid){ referenced[bid] = true; });
    }
  });
  var all = BOARDINFO_RAW.boards[groupKey] || [];
  return all.filter(function(b){ return !referenced[b.id]; }).map(function(b){ return b.id; });
}

/* ---- distinct side/section values for a rack, in first-seen order.
   Not every group uses literal '전면'/'후면' (e.g. TWC uses '현장', 분전반류는 '-',
   IFC/PSD add '인접랙'/'방폭함' 등) — the toggle must reflect whatever this rack actually has,
   otherwise rows whose side doesn't match a hardcoded '전면'/'후면' button never display. */
function groupSides(rack){
  var seen = {}; var out = [];
  (rack.boards || []).forEach(function(row){
    var s = row.side || '전면';
    if (!seen[s]) { seen[s] = true; out.push(s); }
  });
  return out.length ? out : ['전면'];
}
function firstSide(groupKey){
  var g = GROUPS[groupKey];
  if (!g || g.kind !== 'cabinet') return '전면';
  return groupSides(RACK.racks[g.rackKey])[0];
}

/* ---- cabinet level (SICAS / EC-DSTT / ...) ---- */
function renderCabinetLevel(groupKey){
  var g = GROUPS[groupKey];
  var rack = RACK.racks[g.rackKey];
  var sides = groupSides(rack);
  var h = '';

  /* Some groups (분전반AC/DC) only have ONE real reference diagram covering every
     row at once (a full panel/circuit drawing) rather than a distinct image per row.
     Show that once here, then let each row below be a plain clickable text entry
     (noThumb) that jumps straight to its own text description — no per-row image. */
  if (rack.overviewImageRef && BOARD_SVG[rack.overviewImageRef]) {
    h += '<div class="panel-overview"><div class="po-caption">전체 구성도 (아래 각 행을 누르면 해당 항목 설명으로 이동)</div>'
      + nsSvg(BOARD_SVG[rack.overviewImageRef], 'povw') + '</div>';
  }

  if (sides.length > 1) {
    h += '<div class="side-toggle">';
    sides.forEach(function(s){
      h += '<button class="side-btn' + (state.cabSide===s?' active':'') + '" data-act="cabside" data-side="' + s + '">' + escapeHtml(s) + '</button>';
    });
    h += '</div>';
  }

  var CMM_THUMB_H = 104;
  var cardsHtml = '';
  var restHtml = '';
  rack.boards.forEach(function(row, idx){
    if (row.side !== state.cabSide) return;
    /* [2026-09-15] 예전에는 frameRef/boardRef가 있는 행만 클릭 가능했음 — 보드 정보가
       아예 없는 순수 텍스트 행(G/H/L 레벨의 터미널단자·휴즈 등, 59건)은 눌러도 아무 반응이
       없었다. 이제 그런 행도 눌러서 실물 사진을 보고 마커를 찍을 수 있도록(renderRowDetail)
       모든 행을 클릭 가능하게 바꿈 — 실제 목적지는 아래 event delegation의 'cabrow'
       분기(row.boardRef/frameRef/boardOrder 없으면 rowDetail로 이동)에서 결정된다. */
    /* (여백) 행은 실제 장비가 아니라 빈 공간 표시용이라, 클릭·사진 아이콘 모두 붙이지 않는다. */
    var isBlank = (row.label === '(여백)');
    var clickable = !isBlank;
    var frame = row.frameRef ? (rack.channelFrames && rack.channelFrames[row.frameRef]) : null;

    /* boardIds for an inline packed strip: either an explicit per-row mix (row.boardOrder —
       e.g. 5× bridging + 5× switching units sharing one shelf), several DISTINCT board types
       (a channel's VESUV3·VENUS3·...) from a channelFrame, or the SAME board repeated N times
       (OLM×5, 주전원×3). Either way, show every physical instance's own image directly — no
       click needed to see them, and each tile jumps straight to that board's detail page.
       row.noThumb opts a row out of all image rendering (text-only), e.g. IFC's 인접랙 rows
       where a real board image would be misleading (relay racks/terminal blocks, not PCBs). */
    var boardIds = row.noThumb ? null
      : (row.boardOrder && row.boardOrder.length ? row.boardOrder
      : (frame && frame.boardOrder && frame.boardOrder.length ? frame.boardOrder
      : (row.boardRef && row.count > 1 ? new Array(row.count).fill(row.boardRef) : null)));

    if (boardIds) {
      restHtml += '<div class="cab-row">';
      restHtml += '<div class="cab-main-multi clickable" data-act="cabrow" data-idx="' + idx + '">';
      restHtml += '<div class="cmm-label">' + (isBlank ? '' : cameraIconBtn('cabrow:' + groupKey + ':' + idx, groupKey, row.label)) + '<span>' + escapeHtml(row.label) + '</span>'
        + (row.count ? '<span class="cm-count">×' + row.count + '</span>' : '') + '</div>';
      restHtml += '<div class="cmm-thumbs" data-fill="1">';
      var sibList = boardIds.filter(function(x){ return x !== '__SEP__' && x.indexOf('__LABEL__') !== 0; });
      var sibAttr = sibList.length > 1 ? ' data-siblings="' + sibList.join('|') + '"' : '';
      boardIds.forEach(function(bid, bi){
        /* [2026-09-15] 채널 프레임처럼 실제 장착 수량(예: STELA3 ×14)이 이미지 타일 개수보다
           훨씬 많은 경우, 대표 이미지 2개만 두고 그 사이에 '~' 구분 기호, 뒤에 '×N' 텍스트를
           넣는 표기를 위한 sentinel 값. 실제 보드 id가 아니므로 클릭 불가(data-act 없음). */
        if (bid === '__SEP__') { restHtml += '<div class="cmm-thumb cmm-text cmm-sep">~</div>'; return; }
        if (bid.indexOf('__LABEL__') === 0) { restHtml += '<div class="cmm-thumb cmm-text cmm-taglabel">' + escapeHtml(bid.slice(9)) + '</div>'; return; }
        var lbl = boardLabel(bid);
        if (BOARD_SVG[bid]) {
          var ar = svgAspect(bid);
          var w = Math.max(28, Math.round(CMM_THUMB_H * ar));
          restHtml += '<div class="cmm-thumb" style="width:' + w + 'px;height:' + CMM_THUMB_H + 'px" data-ar="' + ar + '" data-act="board" data-board="' + bid + '" data-from="rack"' + sibAttr + ' title="' + escapeHtml(lbl) + '">'
            + nsSvg(BOARD_SVG[bid], 'cmm' + idx + '_' + bi) + '</div>';
        } else {
          restHtml += '<div class="cmm-thumb cmm-text" data-act="board" data-board="' + bid + '" data-from="rack"' + sibAttr + '>' + escapeHtml(lbl) + '</div>';
        }
      });
      restHtml += '</div></div>';
      restHtml += '<div class="cab-letter">' + escapeHtml(row.row) + '</div>';
      restHtml += '</div>';
      return;
    }

    var thumbBid = (!row.noThumb && row.boardRef && BOARD_SVG[row.boardRef]) ? row.boardRef : null;

    /* [2026-09-16] '현장설비' 탭에서 실제 보드 이미지가 있는 단일 행(C/B박스 등)은
       사용자 요청으로 작은 리스트 행 대신 이미지가 큼직한 2열 카드로 보여준다. 이미지가
       없는 행(S본드/D-C박스처럼 사진 아이콘만 있는 행)은 계속 기존 리스트로 유지된다 —
       다른 그룹(SICAS/EC-DSTT/...)의 전면/후면 탭은 이 조건(cabSide==='현장설비')에
       해당하지 않으므로 전혀 영향받지 않고, 앞으로 다른 그룹에 현장설비 행이 늘어나도
       이미지가 있으면 자동으로 카드로 들어간다. */
    if (state.cabSide === '현장설비' && thumbBid) {
      cardsHtml += '<div class="field-card clickable" data-act="cabrow" data-idx="' + idx + '">';
      cardsHtml += '<div class="field-card-badge">' + escapeHtml(row.row) + '</div>';
      cardsHtml += '<div class="field-card-img">' + nsSvg(BOARD_SVG[thumbBid], 'fc' + idx) + '</div>';
      cardsHtml += '<div class="field-card-label">'
        + '<div class="fcl-top">' + cameraIconBtn('cabrow:' + groupKey + ':' + idx, groupKey, row.label)
        + (row.count ? '<span class="cm-count">×' + row.count + '</span>' : '') + '</div>'
        + '<div class="fcl-text">' + escapeHtml(row.label) + '</div></div>';
      cardsHtml += '</div>';
      return;
    }

    restHtml += '<div class="cab-row">';
    restHtml += '<div class="cab-main' + (clickable?' clickable':'') + '"' + (clickable ? ' data-act="cabrow" data-idx="' + idx + '"' : '') + '>';
    if (thumbBid) {
      var tw = Math.min(100, Math.max(24, Math.round(46 * svgAspect(thumbBid))));
      restHtml += '<div class="cab-thumb" style="width:' + tw + 'px">' + nsSvg(BOARD_SVG[thumbBid], 'cab' + idx) + '</div>';
    }
    if (!isBlank) restHtml += cameraIconBtn('cabrow:' + groupKey + ':' + idx, groupKey, row.label);
    restHtml += '<span>' + escapeHtml(row.label) + '</span>';
    if (row.count) restHtml += '<span class="cm-count">×' + row.count + '</span>';
    restHtml += '</div>';
    restHtml += '<div class="cab-letter">' + escapeHtml(row.row) + '</div>';
    restHtml += '</div>';
  });
  if (cardsHtml) h += '<div class="field-card-grid">' + cardsHtml + '</div>';
  h += '<div class="cabinet-frame">' + restHtml + '</div>';

  h += '<div class="legend-note">파란 테두리가 있는 행을 탭하면 그 안의 보드들을 볼 수 있습니다. 오른쪽 글자는 원본 캐비닛 구성도의 행 번호입니다.</div>';

  var orphans = groupOrphanBoardIds(groupKey, rack);
  if (orphans.length) {
    h += '<div class="section-title" style="margin-top:14px">기타 항목 (배치도에 없는 보드)</div>';
    h += '<div class="legend-note" style="margin-top:-4px">아래는 캐비닛 배치 자료에 위치가 표시되지 않았지만 정보가 있는 보드/모듈입니다.</div>';
    h += '<div class="concept-grid">';
    orphans.forEach(function(bid, oi){
      var info = BOARDINFO_BY_ID[bid];
      h += '<div class="concept-card" data-act="board" data-board="' + bid + '" data-from="rack">';
      if (BOARD_SVG[bid]) h += '<div class="cc-thumb">' + nsSvg(BOARD_SVG[bid], 'orph' + oi) + '</div>';
      h += '<div class="cc-name">' + escapeHtml(info ? info.name : bid) + '</div>'
        + '<div class="cc-fn">' + escapeHtml((info && info.function ? info.function.slice(0,70) : '')) + ((info && info.function && info.function.length>70)?'…':'') + '</div></div>';
    });
    h += '</div>';
  }
  if (rack.note) h += renderAccordion('racknote-' + g.rackKey, '안내', escapeHtml(rack.note));
  return h;
}

/* ---- board-row level (channel frame / repeated boardRef row) ---- */
function renderBoardRowLevel(){
  var drill = state.rackDrill;
  var h = '<button class="back-btn" data-act="rackback">← 캐비닛으로</button>';
  h += '<div class="board-row-panel">';
  h += '<h3>' + escapeHtml(drill.title) + '</h3>';
  if (drill.note) h += '<div class="legend-note">' + escapeHtml(drill.note) + '</div>';
  h += '<div class="board-row-strip">';
  var drillSibList = drill.boardIds.filter(function(x){ return x !== '__SEP__' && x.indexOf('__LABEL__') !== 0; });
  var drillSibAttr = drillSibList.length > 1 ? ' data-siblings="' + drillSibList.join('|') + '"' : '';
  drill.boardIds.forEach(function(bid, i){
    if (bid === '__SEP__' || bid.indexOf('__LABEL__') === 0) {
      var isLbl = bid.indexOf('__LABEL__') === 0;
      var txt = isLbl ? bid.slice(9) : '~';
      h += '<div class="row-board-tile row-board-sep">'
        + '<div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:' + (isLbl ? '14px' : '24px') + ';font-weight:700;color:var(--ink2)">' + escapeHtml(txt) + '</div>'
        + '</div>';
      return;
    }
    var info = BOARDINFO_BY_ID[bid];
    var fnShort = info && info.function ? info.function.slice(0, 46) + (info.function.length>46?'…':'') : '';
    var idxLabel = drill.instanceLabels ? drill.instanceLabels[i] : boardLabel(bid);
    var img = BOARD_SVG[bid] ? nsSvg(BOARD_SVG[bid], 'row' + i) : '';
    h += '<div class="row-board-tile" data-act="board" data-board="' + bid + '" data-from="rack"' + drillSibAttr + '>';
    h += '<div class="rbt-idx">' + escapeHtml(idxLabel) + '</div>';
    h += '<div class="rbt-slot' + (img ? '' : ' empty') + '">' + img + '</div>';
    h += '<div class="rbt-fn">' + escapeHtml(fnShort) + '</div>';
    h += '</div>';
  });
  h += '</div></div>';
  return h;
}

/* ---- FTGS board row (no cabinet level — physically a single PCB row) [legacy, no longer used since FTGS became 'cabinet' kind — kept for reference] ---- */
function renderFtgsBoardRow(){
  var boards = BOARDINFO_RAW.boards['FTGS'] || [];
  var frontOrder = ['FTGS_TX_PCB','FTGS_AMP_FILTER_PCB','FTGS_RX1_PCB','FTGS_DEMOD_PCB','FTGS_RX2_PCB','FTGS_GF_RELAY_PCB','FTGS_TELEGRAM_SWITCH_PCB'];
  var haveFront = frontOrder.filter(function(id){ return !!BOARDINFO_BY_ID[id]; });
  var rest = boards.map(function(b){ return b.id; }).filter(function(id){ return haveFront.indexOf(id) < 0; });

  var h = '<div class="board-row-panel"><h3>FTGS 보드 1열</h3>';
  h += '<div class="board-row-strip">';
  haveFront.forEach(function(bid){
    var info = BOARDINFO_BY_ID[bid];
    var fnShort = info && info.function ? info.function.slice(0, 46) + (info.function.length>46?'…':'') : '';
    h += '<div class="row-board-tile" data-act="board" data-board="' + bid + '" data-from="rack">'
      + '<div class="rbt-idx">' + escapeHtml(boardLabel(bid)) + '</div>'
      + '<div class="rbt-slot"></div>'
      + '<div class="rbt-fn">' + escapeHtml(fnShort) + '</div></div>';
  });
  h += '</div></div>';

  if (rest.length) {
    h += '<div class="section-title">기타 구성 (전원부·현장측 접속 관련)</div>';
    h += '<div class="concept-grid">';
    rest.forEach(function(bid){
      var info = BOARDINFO_BY_ID[bid];
      h += '<div class="concept-card" data-act="board" data-board="' + bid + '" data-from="rack">'
        + '<div class="cc-name">' + escapeHtml(info ? info.name : bid) + '</div>'
        + '<div class="cc-fn">' + escapeHtml(info && info.function ? info.function.slice(0,70) : '') + '</div></div>';
    });
    h += '</div>';
  }
  /* 안내 배너는 화면 맨 아래로(사용자 요청). */
  h += '<div class="banner info">FTGS는 캐비닛이 아니라 랙 하나에 보드 1열이 반복되는 구조입니다(랙 1개 = 궤도회로 10개분). 아래는 하나의 랙 안 보드 배치(증폭&필터 → 송신 → 수신1 → 복조 → 수신2 → 계전기 → 텔레그램 순)입니다.</div>';
  return h;
}

/* ---- concept grid (groups without real layout data yet) ---- */
function renderConceptGrid(groupKey){
  var boards = BOARDINFO_RAW.boards[groupKey] || [];
  var h = '<div class="concept-grid">';
  boards.forEach(function(b, bi){
    h += '<div class="concept-card" data-act="board" data-board="' + b.id + '" data-from="rack">';
    if (BOARD_SVG[b.id]) h += '<div class="cc-thumb">' + nsSvg(BOARD_SVG[b.id], 'cg' + bi) + '</div>';
    h += '<div class="cc-name">' + escapeHtml(b.name) + '</div>'
      + '<div class="cc-fn">' + escapeHtml((b.function||'').slice(0,70)) + ((b.function||'').length>70?'…':'') + '</div></div>';
  });
  h += '</div>';
  h += '<div class="note-text">이 장비군은 아직 실제 캐비닛 배치 자료(사진/도면)가 없어 보드 목록을 개념도로만 보여줍니다. 실물 배치 자료가 확보되면 SICAS·EC/DSTT처럼 캐비닛 구성도로 교체할 예정입니다.</div>';
  return h;
}

/* =========================================================
   보드 상세 (drill-down leaf)
   ========================================================= */
function ledLegendAndPopover(leds, boardId){
  var h = '<div class="led-legend">';
  leds.forEach(function(led){
    var sel = (state.selectedLed === led.id) ? ' selected' : '';
    h += '<div class="led-row' + sel + '" data-act="led" data-led="' + led.id + '" data-board="' + boardId + '">'
      + '<span class="dot"></span>'
      + '<span class="txt"><b>' + escapeHtml(led.label) + '</b>' + (led.section ? ' <span style="color:var(--ink3)">(' + escapeHtml(led.section) + ')</span>' : '') + ' — ' + escapeHtml(led.normalState || '') + '</span>'
      + '</div>';
  });
  h += '</div>';

  if (state.selectedLed) {
    var led = leds.find(function(l){ return l.id === state.selectedLed; });
    if (led) {
      h += '<div class="led-popover">';
      h += '<div class="lp-title">LED ' + escapeHtml(led.label) + '</div>';
      h += '<div style="margin-top:4px">' + escapeHtml(led.meaning || '') + '</div>';
      h += '<div style="margin-top:4px;color:var(--ink3)">정상 상태: ' + escapeHtml(led.normalState || '-') + '</div>';
      if (led.abnormal) h += '<div class="abn">이상 시: ' + escapeHtml(led.abnormal) + '</div>';
      h += '</div>';
    }
  }

/* LED x/y coordinates in board-face.json were hand-estimated against a generic
   placeholder box (3:4 or 16:9) before the real board photo/illustration existed.
   Once the real image replaced that placeholder, those fractions no longer line up
   with where the LED actually sits on the real artwork. FACE_XY_OVERRIDE holds
   corrected fractions re-derived directly from each real SVG's own LED geometry,
   for boards where both a real image and hand-authored LED coordinates exist. */
function ledOverridePos(boardId, ledId, fallbackX, fallbackY){
  var g = FACE_XY_OVERRIDE[boardId];
  var p = g && g[ledId];
  return p ? { x: p[0], y: p[1] } : { x: fallbackX, y: fallbackY };
}

/* auto-generated vertical LED column — used when board-face.json has no hand-authored coordinates

var FAULT_DOMAIN_ORDER = ['연동장치', 'EC/DSTT', '전원', '신호기', '선로전환기', '선로전환기 감시(OTS)', 'ATO Loop', 'TWC', 'AF궤도회로'];

function faultDomainCounts(){
  var counts = {};
  (FCASES.cases || []).forEach(function(c){ var d = c.domain || '기타'; counts[d] = (counts[d] || 0) + 1; });
  return counts;
}
function faultFavCount(){
  return Object.keys(faultFavorites).filter(function(k){ return faultFavorites[k]; }).length;
}
function renderFaultDomainSwitch(){
  var counts = faultDomainCounts();
  var order = FAULT_DOMAIN_ORDER.filter(function(f){ return counts[f]; });
  Object.keys(counts).forEach(function(f){ if (order.indexOf(f) < 0) order.push(f); });
  var total = (FCASES.cases || []).length;
  var h = '<div class="group-switch">';
  var totalActive = (state.faultDomain === 'all');
  h += '<button class="group-chip' + (totalActive?' active':'') + '" style="' + (totalActive ? 'color:var(--steel);background:var(--steelbg)' : '') + '" data-act="faultdomain" data-domain="all">전체 (' + total + ')</button>';
  order.forEach(function(f){
    var active = (state.faultDomain === f);
    h += '<button class="group-chip' + (active?' active':'') + '" style="' + (active ? 'color:var(--steel);background:var(--steelbg)' : '') + '" data-act="faultdomain" data-domain="' + escapeHtml(f) + '">' + escapeHtml(f) + ' (' + counts[f] + ')</button>';
  });
  h += '</div>';
  return h;
}
function renderFaultTab(){
  /* 안내 배너는 화면 맨 아래로(사용자 요청) — 두 return 지점 모두에서 덧붙임. */
  var topBanner = '<div class="banner info">진단 매뉴얼에 정리된 고장상황(총 ' + ((FCASES.cases||[]).length) + '건)을 한 화면에서 훑어볼 수 있습니다. ★을 눌러 자주 보는 것을 즐겨찾기하면 목록 맨 위로 올라오고, "즐겨찾기만 보기"로 나머지를 잠시 숨길 수 있습니다.</div>';
  var h = '';

  var favN = faultFavCount();
  h += '<div style="display:flex;align-items:center;gap:8px;margin:8px 0 4px;flex-wrap:wrap">'
    + '<button class="photo-mini-btn' + (state.faultFavOnly ? ' pri' : '') + '" data-act="faultfavtoggle">' + (state.faultFavOnly ? '★ 즐겨찾기만 보는 중' : '☆ 즐겨찾기만 보기') + (favN ? ' (' + favN + ')' : '') + '</button>'
    + '</div>';

  h += renderFaultDomainSwitch();

  var cases = (FCASES.cases || []).slice();
  if (state.faultDomain !== 'all') cases = cases.filter(function(c){ return c.domain === state.faultDomain; });
  if (state.faultFavOnly) cases = cases.filter(function(c){ return !!faultFavorites[c.id]; });
  /* 즐겨찾기를 맨 위로 — 그 안에서는 원래 순서(도메인/자료상 순서) 유지 */
  cases = cases.map(function(c, i){ return { c: c, i: i }; })
    .sort(function(a, b){
      var fa = faultFavorites[a.c.id] ? 1 : 0, fb = faultFavorites[b.c.id] ? 1 : 0;
      if (fa !== fb) return fb - fa;
      return a.i - b.i;
    }).map(function(x){ return x.c; });

  if (!cases.length) {
    h += '<div class="photo-empty-hint">' + (state.faultFavOnly ? '즐겨찾기한 고장상황이 아직 없습니다. ☆을 눌러 추가해보세요.' : '해당 분류의 고장상황이 없습니다.') + '</div>';
    h += topBanner;
    return h;
  }

  h += '<div class="mp-list">';
  cases.forEach(function(c){
    var fav = !!faultFavorites[c.id];
    var open = (state.faultOpenId === c.id);
    h += '<div class="stage-card" style="margin-bottom:10px' + (fav ? ';border-left:4px solid var(--warn)' : '') + '">';
    h += '<div class="stage-title" style="cursor:pointer;gap:8px" data-act="fault" data-fault="' + c.id + '">'
      + '<button class="fav-star' + (fav?' on':'') + '" data-act="favfault" data-fault="' + c.id + '" title="즐겨찾기">' + (fav ? '★' : '☆') + '</button>'
      + '<span style="flex:1 1 auto;min-width:140px">' + escapeHtml(c.symptom) + '</span>'
      + '<span class="mono" style="font-size:11px;color:var(--ink3);font-weight:400">' + escapeHtml(c.domain) + '</span>'
      + '</div>';
    if (open) h += renderFaultDetail(c.id);
    h += '</div>';
  });
  h += '</div>';
  h += topBanner;
  return h;
}

      });
      h += '</div>';
      info.relatedMeasurePoints.forEach(function(mpid){ if (state.mpExpanded[mpid]) h += renderMpDetail(mpid); });
    }

    if (info.relatedFaultCases && info.relatedFaultCases.length) {
      h += '<div class="section-title">관련 장애사례</div>' + renderFaultBadges(info.relatedFaultCases, boardId);
    }
  }

  /* [2026-09-16] 예전에는 이미지화(실물풍 SVG)가 안 된 보드와 info.forcePhotoSection이
     켜진 일부 보드에만 실물 사진/동영상 섹션을 보여줬음 — 사용자 제보: "보드 이미지가
     있는 곳은 사진을 넣고 마커를 놓을 수 없었다"는 문제. 이제 실물풍 이미지가 이미 있는
     보드를 포함해 모든 보드 상세페이지에 이 섹션을 항상 보여준다(위 "이 장비에 사진
     지정" 기능으로 이 보드만의 사진을 정확히 골라 연결할 수 있음). */
  h += renderPhotoSection('board:' + boardId, group, '실물 사진 / 동영상');

  h += '</div>';
  return h;
}

/* 보드 정보(board-info.json)가 없는 순수 텍스트 행 상세 — 예: EC/DSTT의 G/H/L 레벨
   (전원공급 터미널단자, 제어·모터 휴즈 등) 처럼 배치도에 이름만 있고 보드 id가 없는
   물리적 위치. 보드 상세페이지와 달리 보드 데이터가 없으므로 제목 + 실물 사진/동영상
   섹션만 보여준다. */
function renderRowDetail(){
  var rd = state.rowDetail;
  var g = GROUPS[rd.groupKey];
  var accent = g ? g.accent : 'var(--steel)';
  var rack = g ? RACK.racks[g.rackKey] : null;
  var row = rack ? rack.boards[rd.idx] : null;

  var h = '<button class="back-btn" data-act="rowback">← 뒤로</button>';
  h += '<div class="board-detail" style="border-top:4px solid ' + accent + '">';
  h += '<h2>' + escapeHtml(rd.label) + '</h2>';
  h += '<div class="sub">' + escapeHtml(g ? g.label : rd.groupKey) + (row && row.row ? ' · 행 ' + escapeHtml(row.row) : '') + '</div>';
  h += '<div class="banner info" style="margin-top:12px">이 위치는 별도 보드 정보(회로도·기능 설명)는 없지만, 실제 캐비닛 사진을 붙여 어떻게 생겼는지 확인하고 마커를 찍을 수 있습니다.</div>';
  if (row && row.note) h += '<div class="note-text">' + escapeHtml(row.note) + '</div>';
  if (row && row.measurePointRef && row.measurePointRef.length) {
    h += '<div class="section-title">관련 측정지점</div><div class="stage-actions">';
    row.measurePointRef.forEach(function(mpid){
      var mp = MPOINTS_BY_ID[mpid];
      h += '<button class="chip-btn" data-act="mp" data-mp="' + mpid + '">' + escapeHtml(mp ? mp.title : mpid) + ' ›</button>';
    });
    h += '</div>';
    row.measurePointRef.forEach(function(mpid){ if (state.mpExpanded[mpid]) h += renderMpDetail(mpid); });
  }
  h += renderPhotoSection('row:' + rd.groupKey + ':' + rd.idx, rd.groupKey, '실물 사진 / 동영상');
  h += '</div>';
  return h;
}

/* =========================================================
   TAB 4 — 측정지점 (범용, 역 무관 — 마커편집기 정보 재사용)
   ========================================================= */
var MEASURE_FACILITY_ORDER = ['SICAS','LZB700M','IFC','FTGS','TWC','선로전환기','OTS','TMS','신호기','분기부 안전설비'];

function measureFacilityCounts(){
  var counts = {};
  (MPOINTS.points || []).forEach(function(mp){
    var f = mp.facility || '기타';
    counts[f] = (counts[f] || 0) + 1;
  });
  return counts;
}

function renderMeasureFacilitySwitch(){
  var counts = measureFacilityCounts();
  var order = MEASURE_FACILITY_ORDER.filter(function(f){ return counts[f]; });
  Object.keys(counts).forEach(function(f){ if (order.indexOf(f) < 0) order.push(f); });
  var h = '<div class="group-switch">';
  var totalActive = (state.measureFacility === 'all');
  h += '<button class="group-chip' + (totalActive?' active':'') + '" style="' + (totalActive ? 'color:var(--steel);background:var(--steelbg)' : '') + '" data-act="mfacility" data-facility="all">전체 (' + (MPOINTS.points || []).length + ')</button>';
  order.forEach(function(f){
    var active = (state.measureFacility === f);
    h += '<button class="group-chip' + (active?' active':'') + '" style="' + (active ? 'color:var(--steel);background:var(--steelbg)' : '') + '" data-act="mfacility" data-facility="' + escapeHtml(f) + '">' + escapeHtml(f) + ' (' + counts[f] + ')</button>';
  });
  h += '</div>';
  return h;
}

function thresholdText(t){
  var v = (t.min != null && t.max != null) ? (t.min + '~' + t.max)
    : (t.min != null ? (t.min + ' 이상') : (t.max != null ? (t.max + ' 이하') : ''));
  return (t.label ? t.label + ' ' : '') + v + (t.unit ? ' ' + t.unit : '');
}

function measurePointSummary(mp){
  /* [2026-09-16] range.min 또는 range.max 중 하나가 없는 항목(예: "40℃ 이하"처럼 하한이
     없거나, "1MΩ 이상"처럼 상한이 없는 경우)을 "undefined~40"처럼 잘못 표시하던 버그 수정 —
     thresholds와 동일한 thresholdText()로 통일해서 이상/이하 표기를 올바르게 적용. */
  if (mp.range) return escapeHtml(thresholdText(mp.range));
  if (mp.thresholds && mp.thresholds.length) return escapeHtml(mp.thresholds.map(thresholdText).join(' / '));
  if (mp.normalState) return escapeHtml(mp.normalState);
  if (mp.ledCheck) return 'LED 확인';
  return '';
}

function renderMeasureList(points){
  var h = '<div class="mp-list">';
  points.forEach(function(mp){
    var expanded = !!state.mpExpanded[mp.id];
    h += '<div class="stage-card" style="margin-bottom:10px">';
    h += '<div class="stage-title" style="cursor:pointer" data-act="mp" data-mp="' + mp.id + '">'
      + cameraIconBtn('mp:' + mp.id, mp.facility || '기타', mp.title)
      + '<span style="flex:1 1 auto;min-width:140px">' + escapeHtml(mp.title) + '</span>'
      + '<span class="mono" style="font-size:13.5px;color:var(--ink3);font-weight:400">' + measurePointSummary(mp) + '</span>'
      + '</div>';
    if (mp.boardRef) {
      h += '<div class="stage-actions"><button class="chip-btn board" data-act="board" data-board="' + mp.boardRef + '" data-from="measure">보드 상세: ' + escapeHtml(boardLabel(mp.boardRef)) + ' →</button></div>';
    }
    if (expanded) {
      h += renderMpDetail(mp.id);
      h += renderPhotoSection('mp:' + mp.id, mp.facility || '기타', '이 측정지점 실물 사진 / 동영상');
    }
    h += '</div>';
  });
  h += '</div>';
  return h;
}

function renderMeasureTab(){
  var h = renderMeasureFacilitySwitch();

  var points = (MPOINTS.points || []).slice();
  if (state.measureFacility !== 'all') {
    points = points.filter(function(mp){ return mp.facility === state.measureFacility; });
    h += renderMeasureList(points);
  } else {
    var order = MEASURE_FACILITY_ORDER.slice();
    var counts = measureFacilityCounts();
    Object.keys(counts).forEach(function(f){ if (order.indexOf(f) < 0) order.push(f); });
    order.forEach(function(f){
      var group = points.filter(function(mp){ return mp.facility === f; });
      if (!group.length) return;
      h += '<div class="section-title">' + escapeHtml(f) + ' (' + group.length + ')</div>';
      h += renderMeasureList(group);
    });
  }
  /* 안내 배너는 화면 맨 아래로(사용자 요청). */
  h += '<div class="banner info">고장 진단용 측정지점입니다. 측정방법·정상범위는 역과 무관한 범용 표준 규격이며, 개별 항목의 "측정위치"에 적힌 캐비닛/랙 이름(T51, O51 등)만 신도림 기준 표기입니다 — 다른 역은 실제 캐비닛 이름으로 바꿔 읽으면 됩니다.</div>';
  return h;
}

/* =========================================================
   TAB 3 — 전원흐름 (+ 위치 표시기)
   ========================================================= */
function stageLocatorHtml(rack, stage){
  if (!rack || !rack.boards) return '';
  var matches = rack.boards.filter(function(r){
    var byBoard = stage.boardRef && r.boardRef === stage.boardRef;
    var byMp = stage.measurePointRef && r.measurePointRef && stage.measurePointRef.some(function(m){ return r.measurePointRef.indexOf(m) >= 0; });
    return byBoard || byMp;
  });
  if (!matches.length) return '';
  var side = matches[0].side;
  var rowsOnSide = rack.boards.filter(function(r){ return r.side === side; });
  var h = '<div class="mini-cabinet"><div class="mini-cabinet-title">' + escapeHtml(side) + ' 기준<br>위치</div><div class="mini-rows">';
  rowsOnSide.forEach(function(r){
    var hi = matches.indexOf(r) >= 0;
    h += '<div class="mini-row' + (hi?' hi':'') + '" title="' + escapeHtml(r.row + ' ' + r.label) + '">' + escapeHtml(r.row) + '</div>';
  });
  h += '</div></div>';
  return h;
}

function renderPowerFlow(){
  var g = GROUPS[state.group];
  if (g.kind !== 'cabinet') {
    return '<div class="note-text">이 장비군은 아직 전원흐름 데이터가 준비되지 않았습니다 (SICAS/EC-DSTT부터 우선 정리되어 있습니다).</div>';
  }
  var rack = RACK.racks[g.rackKey];
  var accent = g.accent;
  var stages = rack.powerFlow || [];
  var h = '<div class="stepper">';
  stages.forEach(function(stage, i){
    h += '<div class="stage-card">';
    h += '<div class="stage-title"><span class="stage-num" style="background:' + accent + '">' + (i + 1) + '</span>'
      + cameraIconBtn('power:' + g.rackKey + ':' + i, state.group, stage.stage)
      + escapeHtml(stage.stage) + '</div>';
    h += '<div class="stage-desc">' + escapeHtml(stage.desc) + '</div>';
    h += stageLocatorHtml(rack, stage);

    var actions = '';
    if (stage.measurePointRef) {
      stage.measurePointRef.forEach(function(mpid){
        var mp = MPOINTS_BY_ID[mpid];
        actions += '<button class="chip-btn" data-act="mp" data-mp="' + mpid + '">측정지점: ' + escapeHtml(mp ? mp.title : mpid) + ' ›</button>';
      });
    }
    if (stage.boardRef) {
      actions += '<button class="chip-btn board" data-act="board" data-board="' + stage.boardRef + '" data-from="power">보드 상세: ' + escapeHtml(boardLabel(stage.boardRef)) + ' →</button>';
    }
    if (actions) h += '<div class="stage-actions">' + actions + '</div>';

    if (stage.measurePointRef) {
      stage.measurePointRef.forEach(function(mpid){ if (state.mpExpanded[mpid]) h += renderMpDetail(mpid); });
    }
    h += renderPhotoSection('power:' + g.rackKey + ':' + i, state.group, '이 단계 실물 사진 / 동영상');
    h += '</div>';
    if (i < stages.length - 1) h += '<div class="stage-connector">↓</div>';
  });
  h += '</div>';
  /* 안내 배너는 화면 맨 아래로(사용자 요청). */
  h += '<div class="banner info">전원흐름 단계를 순서대로 보여줍니다. "출력이 없다" 같은 장애가 발생하면 위에서부터 순서대로 확인하면 어디부터 의심해야 하는지 알 수 있습니다. 초록색 칸은 해당 단계가 실제 캐비닛의 어느 행(row)에 있는지를 보여줍니다.</div>';
  return h;
}

/* =========================================================
   EVENT DELEGATION
   ========================================================= */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]');
  if (!t) return;
  var act = t.getAttribute('data-act');

  if (act === 'tab') {
    var newTab = t.getAttribute('data-tab');
    /* 다른 탭에서 "시스템 지도" 탭으로 새로 들어올 때는 확대/이동 상태를 초기화해서
       항상 전체 지도가 한눈에 보이는 상태로 시작하게 한다(탭을 유지한 채 지도 안에서
       노드/엣지만 클릭하는 경우는 render()가 다시 불려도 mapView를 건드리지 않으므로
       확대/이동 상태가 그대로 유지된다). */
    if (newTab === 'map' && state.tab !== 'map') { mapView.scale = null; mapUserInteracted = false; }
    state.tab = newTab;
    state.boardDetail = null; state.boardDetailList = null; state.rackDrill = null; state.selectedLed = null; state.rowDetail = null;
    render();
  } else if (act === 'mapzoom') {
    mapZoomButton(t.getAttribute('data-dir'));
  } else if (act === 'group') {
    state.group = t.getAttribute('data-group');
    state.rackDrill = null; state.boardDetail = null; state.boardDetailList = null; state.rowDetail = null; state.cabSide = firstSide(state.group);
    render();
  } else if (act === 'cabside') {
    state.cabSide = t.getAttribute('data-side');
    render();
  } else if (act === 'cabrow') {
    var idx = parseInt(t.getAttribute('data-idx'), 10);
    var g = GROUPS[state.group];
    var rack = RACK.racks[g.rackKey];
    var row = rack.boards[idx];
    if (row.noThumb && row.boardRef) {
      /* rows marked noThumb (e.g. IFC's 인접랙 relay racks) skip the repeated-image
         drill-down entirely and go straight to the single text-based board detail page. */
      state.boardDetail = row.boardRef; state.boardDetailFrom = 'rack'; state.boardDetailList = null;
      render(); window.scrollTo(0,0);
    } else if (row.frameRef) {
      var frame = rack.channelFrames[row.frameRef];
      state.rackDrill = { title: (row.channel ? '채널 ' + row.channel + ' — ' : '') + frame.title, note: frame.note, boardIds: frame.boardOrder.slice() };
      render(); window.scrollTo(0,0);
    } else if (row.boardOrder && row.boardOrder.length) {
      state.rackDrill = { title: row.label, note: row.note || null, boardIds: row.boardOrder.slice() };
      render(); window.scrollTo(0,0);
    } else if (row.boardRef && row.count > 1) {
      var base = boardLabel(row.boardRef);
      var labels = []; for (var i2 = 1; i2 <= row.count; i2++) labels.push(base + '-' + i2);
      state.rackDrill = { title: row.label, note: row.note || null, boardIds: new Array(row.count).fill(row.boardRef), instanceLabels: labels };
      render(); window.scrollTo(0,0);
    } else if (row.boardRef) {
      state.boardDetail = row.boardRef; state.boardDetailFrom = 'rack'; state.boardDetailList = null;
      render(); window.scrollTo(0,0);
    } else {
      /* 보드 정보 자체가 없는 순수 텍스트 행(예: EC/DSTT G/H/L 레벨의 터미널단자·휴즈) —
         실물 사진/동영상만 보여주는 간단한 상세 화면으로 이동. */
      state.rowDetail = { groupKey: state.group, idx: idx, label: row.label };
      render(); window.scrollTo(0,0);
    }
  } else if (act === 'rowback') {
    state.rowDetail = null;
    render();
  } else if (act === 'rackback') {
    state.rackDrill = null;
    render();
  } else if (act === 'node') {
    var nid = t.getAttribute('data-node');
    var gk = NODE_ID_TO_GROUPKEY[nid];
    if (gk) {
      state.tab = 'rack'; state.group = gk; state.rackDrill = null; state.boardDetail = null; state.boardDetailList = null; state.rowDetail = null;
      state.cabSide = NODE_ID_TO_SIDE[nid] || firstSide(gk);
      render(); window.scrollTo(0,0);
    } else {
      state.selectedNode = (state.selectedNode === nid) ? null : nid;
      state.selectedEdge = null;
      render();
    }
  } else if (act === 'edge') {
    var idx2 = parseInt(t.getAttribute('data-edge'), 10);
    state.selectedEdge = (state.selectedEdge === idx2) ? null : idx2;
    state.selectedNode = null;
    render();
  } else if (act === 'board') {
    var bdid = t.getAttribute('data-board');
    state.boardDetail = bdid;
    state.rowDetail = null;
    var from = t.getAttribute('data-from');
    if (from) state.boardDetailFrom = from;
    var sibs = t.getAttribute('data-siblings');
    state.boardDetailList = sibs ? { ids: sibs.split('|'), idx: sibs.split('|').indexOf(bdid) } : null;
    state.selectedLed = null;
    render(); window.scrollTo(0,0);
  } else if (act === 'imgzoom') {
    state.imgZoom = t.getAttribute('data-board');
    renderImgZoomRoot();
  } else if (act === 'imgzoomclose') {
    state.imgZoom = null;
    renderImgZoomRoot();
  } else if (act === 'boardnav') {
    var dir = parseInt(t.getAttribute('data-dir'), 10);
    var list = state.boardDetailList;
    if (list) {
      var ni = list.idx + dir;
      if (ni >= 0 && ni < list.ids.length) {
        list.idx = ni;
        state.boardDetail = list.ids[ni];
        state.selectedLed = null;
        render(); window.scrollTo(0,0);
      }
    }
  } else if (act === 'back') {
    state.boardDetail = null;
    state.boardDetailList = null;
    state.selectedLed = null;
    if (state.boardDetailFrom && state.boardDetailFrom !== 'rack') state.tab = state.boardDetailFrom;
    render();
  } else if (act === 'led') {
    var lid = t.getAttribute('data-led');
    state.selectedLed = (state.selectedLed === lid) ? null : lid;
    render();
  } else if (act === 'mp') {
    var mid = t.getAttribute('data-mp');
    state.mpExpanded[mid] = !state.mpExpanded[mid];
    render();
  } else if (act === 'mfacility') {
    state.measureFacility = t.getAttribute('data-facility');
    render();
  } else if (act === 'fault') {
    var fid2 = t.getAttribute('data-fault');
    state.faultOpenId = (state.faultOpenId === fid2) ? null : fid2;
    render();
  } else if (act === 'favfault') {
    e.stopPropagation();
    var fid3 = t.getAttribute('data-fault');
    if (faultFavorites[fid3]) delete faultFavorites[fid3]; else faultFavorites[fid3] = true;
    saveFaultFavorites();
    render();
  } else if (act === 'faultfavtoggle') {
    state.faultFavOnly = !state.faultFavOnly;
    render();
  } else if (act === 'faultdomain') {
    state.faultDomain = t.getAttribute('data-domain');
    render();
  } else if (act === 'accordion') {
    var akey = t.getAttribute('data-accordion');
    state.accordionOpen[akey] = !state.accordionOpen[akey];
    render();
  } else if (act === 'dismiss') {
    var bkey = t.getAttribute('data-banner');
    state.dismissed[bkey] = true;
    render();
  } else if (act === 'qpopen') {
    openQuickPreview(t.getAttribute('data-section'), t.getAttribute('data-group'), t.getAttribute('data-label'));
  } else if (act === 'qpclose') {
    closeQuickPreview();
  } else if (act === 'qpnoop') {
    /* 팝업 내부 빈 영역 클릭 — 아무 동작 없음 */
  } else if (act === 'qpprev') {
    qpStep(-1);
  } else if (act === 'qpnext') {
    qpStep(1);
  } else if (act === 'photocurate') {
    openPhotoCurate(t.getAttribute('data-section'), t.getAttribute('data-group'), t.getAttribute('data-label'));
  } else if (act === 'curateclose') {
    closePhotoCurate();
  } else if (act === 'curatetoggle') {
    togglePhotoCurateItem(t.getAttribute('data-folder'), t.getAttribute('data-name'));
  } else if (act === 'photocurateclear') {
    e.stopPropagation();
    var clrSection = t.getAttribute('data-section');
    photoManualItems[clrSection] = [];
    savePhotoCurate();
    render();
  }
});

render();
</script>
</body>
